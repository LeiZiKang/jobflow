name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    env:
      JOBFLOW_PROFILE_DIR: ${{ runner.temp }}/jobflow-profile
      JOBFLOW_RUNTIME_DIR: ${{ runner.temp }}/jobflow-runtime
      JOBFLOW_PUBLISH_DENYLIST: ${{ runner.temp }}/no-private-denylist.txt
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: user.email
      GIT_CONFIG_VALUE_0: ci@users.noreply.github.com
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Check publishable files (missing private denylist is expected)
        # Bash 3.2 in UTF-8 locales can consume punctuation following $DENY.
        run: LC_ALL=C ./00-工作流系统/scripts/check-publishable.sh
      - name: Initialize demo workspace
        run: python3 00-工作流系统/bin/jobflow.py init --demo
      - name: Install console dependencies
        working-directory: console
        run: npm ci
      - name: Check demo workspace and TypeScript
        run: ./00-工作流系统/scripts/check-all.sh
      - name: Build console
        working-directory: console
        run: npm run build
      - name: Reset to empty workspace and check again
        run: |
          python3 00-工作流系统/bin/jobflow.py init --force
          ./00-工作流系统/scripts/check-all.sh
      - name: Check menu bar app sources
        run: |
          bash -n 00-工作流系统/menubar-app/build.sh
          swiftc -typecheck 00-工作流系统/menubar-app/main.swift 00-工作流系统/menubar-app/MainWindow.swift
