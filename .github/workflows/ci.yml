name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: user.email
      GIT_CONFIG_VALUE_0: ci@users.noreply.github.com
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      # runner 上下文不能用在 job 级 env 里，所以在第一步写进 GITHUB_ENV
      - name: Set temp directories
        run: |
          echo "JOBFLOW_PROFILE_DIR=$RUNNER_TEMP/jobflow-profile" >> "$GITHUB_ENV"
          echo "JOBFLOW_RUNTIME_DIR=$RUNNER_TEMP/jobflow-runtime" >> "$GITHUB_ENV"
          echo "JOBFLOW_PUBLISH_DENYLIST=$RUNNER_TEMP/no-private-denylist.txt" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(cat VERSION)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Check publishable files (missing private denylist is expected)
        run: ./00-工作流系统/scripts/check-publishable.sh
      - name: Initialize demo workspace
        run: python3 00-工作流系统/bin/jobflow.py init --demo
      - name: Install console dependencies
        working-directory: console
        run: npm ci
      - name: Check demo workspace and TypeScript
        run: ./00-工作流系统/scripts/check-all.sh
      - name: Build console
        working-directory: console
        run: npm run build
      - name: Reset to empty workspace and check again
        run: |
          python3 00-工作流系统/bin/jobflow.py init --force
          ./00-工作流系统/scripts/check-all.sh
      - name: Check menu bar app sources
        run: |
          bash -n 00-工作流系统/menubar-app/build.sh
          swiftc -typecheck 00-工作流系统/menubar-app/main.swift 00-工作流系统/menubar-app/MainWindow.swift
