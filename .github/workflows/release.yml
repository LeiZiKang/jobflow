name: Release DMG

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build universal DMG
        run: ./00-工作流系统/menubar-app/build.sh --dmg "$RUNNER_TEMP/Jobflow.dmg"
      - name: Create release if needed and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/Jobflow.dmg" --clobber
